<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>saurabhjalendra.com — IDE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    background: #1f1f23; color: #e6e6ed;
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    overscroll-behavior: none;
  }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 8px; }
  *::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.16); }
  kbd { font-family: 'Geist Mono', monospace; }
</style>
</head>
<body>

<div id="ide-root"></div>

<!-- Pinned UMD: React + ReactDOM + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<!-- Plain JS data + themes + platform -->
<script src="ide/data.js"></script>
<script src="ide/fly.js"></script>
<script type="text/babel" src="ide/theme.js"></script>
<script type="text/babel" src="ide/platform.js"></script>
<script type="text/babel" src="ide/syntax.jsx"></script>
<script type="text/babel" src="ide/preview.jsx"></script>
<script type="text/babel" src="ide/mobile.jsx"></script>

<!-- Tweaks shell (provides TweaksPanel, useTweaks, Tweak* controls) -->

<!-- IDE components -->
<script type="text/babel" src="ide/chrome.jsx"></script>

<script type="text/babel" src="ide/editor.jsx"></script>

<script type="text/babel" src="ide/splash.jsx"></script>
<script type="text/babel" src="ide/tweaks.jsx"></script>

<!-- Root app last -->
<script type="text/babel" src="ide/app.jsx"></script>
</body>
</html>
